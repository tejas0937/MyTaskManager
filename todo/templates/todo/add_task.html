<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Task</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .form-container h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #6c63ff;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .star-option {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .star-option input {
            width: auto;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button,
        .cancel-btn {
            flex: 1;
            padding: 13px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        button {
            border: none;
            background: #6c63ff;
            color: white;
        }

        button:hover {
            background: #574fd6;
        }

        .cancel-btn {
            border: 1px solid #ddd;
            color: #555;
            background: white;
        }

    </style>

</head>


<body>

    <div class="form-container">

        <h1>✨ Add New Task</h1>

        <p class="subtitle">
            Add something you want to get done.
        </p>


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label for="title">
                    Task Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="What needs to be done?"
                    required
                >

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Add some details..."
                ></textarea>

            </div>


            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <select
                    id="category"
                    name="category"
                >

                    <option value="Self">
                        🏠 Self
                    </option>

                    <option value="Work">
                        💼 Work
                    </option>

                    <option value="Study">
                        📚 Study
                    </option>

                    <option value="Personal">
                        👤 Personal
                    </option>

                    <option value="Other">
                        📌 Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label class="star-option">

                    <input
                        type="checkbox"
                        name="starred"
                    >

                    ⭐ Mark as important

                </label>

            </div>


            <div class="buttons">

                <a
                    href="/"
                    class="cancel-btn"
                >
                    Cancel
                </a>

                <button type="submit">
                    Add Task
                </button>

            </div>

        </form>

    </div>

</body>

</html>
