<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Task</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            min-height: 100vh;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }


        .form-container {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.08);
        }


        .back {
            display: inline-block;
            text-decoration: none;
            color: #6c63ff;
            margin-bottom: 20px;
        }


        h1 {
            margin-bottom: 8px;
        }


        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }


        .form-group {
            margin-bottom: 20px;
        }


        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }


        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }


        input:focus,
        textarea:focus,
        select:focus {
            border-color: #6c63ff;
        }


        textarea {
            height: 120px;
            resize: vertical;
        }


        .star-option {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .star-option input {
            width: auto;
        }


        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }


        button,
        .cancel-btn {
            flex: 1;
            padding: 13px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }


        button {
            border: none;
            background: #6c63ff;
            color: white;
        }


        button:hover {
            background: #574fd6;
        }


        .cancel-btn {
            border: 1px solid #ddd;
            color: #555;
            background: white;
        }

    </style>

</head>


<body>


<div class="form-container">


    <a
        href="{% url 'task_list' %}"
        class="back"
    >
        ← Back to Tasks
    </a>


    <h1>
        ✏️ Edit Task
    </h1>


    <p class="subtitle">
        Update the details of your task.
    </p>



    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label for="title">
                Task Title
            </label>


            <input
                type="text"
                id="title"
                name="title"
                value="{{ task.title }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="description">
                Description
            </label>


            <textarea
                id="description"
                name="description"
            >{{ task.description }}</textarea>

        </div>


        <div class="form-group">

            <label for="category">
                Category
            </label>


            <select
                id="category"
                name="category"
            >

                <option
                    value="Self"
                    {% if task.category == "Self" %}selected{% endif %}
                >
                    🏠 Self
                </option>


                <option
                    value="Work"
                    {% if task.category == "Work" %}selected{% endif %}
                >
                    💼 Work
                </option>


                <option
                    value="Study"
                    {% if task.category == "Study" %}selected{% endif %}
                >
                    📚 Study
                </option>


                <option
                    value="Personal"
                    {% if task.category == "Personal" %}selected{% endif %}
                >
                    👤 Personal
                </option>


                <option
                    value="Other"
                    {% if task.category == "Other" %}selected{% endif %}
                >
                    📌 Other
                </option>

            </select>

        </div>


        <div class="form-group">

            <label class="star-option">

                <input
                    type="checkbox"
                    name="starred"
                    {% if task.starred %}checked{% endif %}
                >

                ⭐ Mark as important

            </label>

        </div>


        <div class="buttons">

            <a
                href="{% url 'task_list' %}"
                class="cancel-btn"
            >
                Cancel
            </a>


            <button type="submit">
                Save Changes
            </button>

        </div>


    </form>


</div>


</body>

</html>
